<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>사업장별 메뉴 사진 비교 대시보드</title>

  <!-- 아이폰(iOS) 및 안드로이드 홈 화면 아이콘 설정 -->
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PlanEAT">
  <link rel="icon" type="image/png" sizes="192x192" href="icon.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon.png">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Pretendard 폰트 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <!-- Cropper.js (사진 확대/자르기 라이브러리) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
    }
    .sticky-col { position: sticky; left: 0; z-index: 10; background-color: #ffffff; }
    .sticky-col-header { position: sticky; left: 0; z-index: 20; }
    .photo-box {
      aspect-ratio: 4 / 3;
      width: 100%;
      background-color: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 0.5rem;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      outline: none;
    }
    .photo-box:focus { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2); }
    /* 4:3은 꽉 차게 보이고, 1:1 정사각형 사진도 위아래 잘림 없이 100% 다 보이도록 contain 적용 */
    .photo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background-color: #f8fafc;
      cursor: zoom-in;
      transition: transform 0.2s ease;
    }
    .photo-box img:hover { transform: scale(1.02); }
    body.modal-active { overflow: hidden; user-select: none; }

    /* Cropper.js 자르기 박스 내부에 '음식 용기 맞춤 가이드라인' 표시 */
    .cropper-crop-box::after {
      content: '이 점선 안에 용기를 꽉 맞춰주세요';
      position: absolute;
      inset: 7%;
      border: 2.5px dashed rgba(250, 204, 21, 0.95);
      border-radius: 14px;
      pointer-events: none;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 6px;
      color: #fef08a;
      font-size: 11px;
      font-weight: 800;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      box-shadow: inset 0 0 12px rgba(0,0,0,0.25);
    }
  </style>
</head>
<body class="min-h-screen pb-12">

  <!-- 1. 저장중/완료 차단 모달 -->
  <div id="blockingModal" class="fixed inset-0 z-[9999] hidden items-center justify-center bg-slate-900/65 backdrop-blur-sm select-none" style="pointer-events: auto;">
    <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-xs w-full mx-4 flex flex-col items-center text-center border border-slate-100">
      <div id="modalSpinner" class="w-14 h-14 border-4 border-slate-200 border-t-blue-600 rounded-full animate-spin mb-4"></div>
      <div id="modalCheck" class="hidden w-14 h-14 bg-emerald-100 text-emerald-600 rounded-full items-center justify-center mb-4">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
      </div>
      <p id="modalText" class="text-lg font-bold text-slate-800 tracking-tight">저장중...</p>
      <p id="modalSubText" class="text-xs text-slate-500 mt-1">완료될 때까지 다른 창을 누를 수 없습니다.</p>
    </div>
  </div>

  <!-- 2. 사진 가이드 맞춤 & 비율 선택(4:3 / 1:1) 자르기(Crop) 모달 -->
  <div id="cropModal" class="fixed inset-0 z-[9500] hidden flex-col bg-slate-950/95 backdrop-blur-md select-none">
    <!-- 상단 안내 헤더 및 비율 선택 탭 -->
    <div class="px-4 py-3 bg-slate-900 text-white flex flex-wrap items-center justify-between gap-2 border-b border-slate-800">
      <div>
        <h3 class="text-sm sm:text-base font-extrabold flex items-center gap-2">
          <span class="px-2 py-0.5 bg-amber-500 text-slate-950 rounded text-xs font-black">가이드 맞춤</span>
          <span>비율을 선택하고 용기를 틀에 꽉 맞춰주세요</span>
        </h3>
        <p class="text-[11px] sm:text-xs text-slate-400 mt-0.5">기본은 4:3 비율이며, 정사각형 용기는 1:1 비율을 선택해 주세요.</p>
      </div>

      <!-- 비율 선택 버튼 (4:3 기본 / 1:1 선택 가능) -->
      <div class="flex items-center gap-2 ml-auto">
        <div class="flex bg-slate-800 p-1 rounded-xl border border-slate-700">
          <button type="button" id="ratioBtn_4_3" onclick="setCropAspectRatio('4:3')" class="px-3 py-1.5 rounded-lg text-xs font-extrabold bg-blue-600 text-white shadow transition">
            4:3 가로형 (기본)
          </button>
          <button type="button" id="ratioBtn_1_1" onclick="setCropAspectRatio('1:1')" class="px-3 py-1.5 rounded-lg text-xs font-extrabold text-slate-300 hover:text-white transition">
            1:1 정사각형
          </button>
        </div>
        <button type="button" onclick="closeCropModal()" class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold border border-slate-700">닫기</button>
      </div>
    </div>

    <!-- 중앙 크롭 작업 영역 -->
    <div class="flex-1 relative w-full overflow-hidden flex items-center justify-center p-2 sm:p-6">
      <div class="w-full h-full max-w-3xl max-h-[66vh] flex items-center justify-center">
        <img id="cropTargetImg" src="" alt="크롭 원본" class="max-w-full max-h-full block">
      </div>
    </div>

    <!-- 하단 조작 툴바 (확대/축소/회전/초기화/저장) -->
    <div class="px-4 py-3.5 bg-slate-900 border-t border-slate-800 flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-1.5">
        <button type="button" onclick="zoomCrop(0.15)" class="px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold border border-slate-700">➕ 확대</button>
        <button type="button" onclick="zoomCrop(-0.15)" class="px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold border border-slate-700">➖ 축소</button>
        <button type="button" onclick="rotateCrop(-90)" class="px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold border border-slate-700">↺ 90° 회전</button>
        <button type="button" onclick="resetCrop()" class="px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold border border-slate-700">초기화</button>
      </div>
      <div class="flex items-center gap-2 ml-auto">
        <button type="button" onclick="closeCropModal()" class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs sm:text-sm font-bold">취소</button>
        <button type="button" onclick="confirmCropAndUpload()" class="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs sm:text-sm font-extrabold shadow-lg shadow-blue-600/30 flex items-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
          <span>이대로 자르기 & 업로드</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 3. 사진 확대 보기 라이트박스 -->
  <div id="lightboxModal" class="fixed inset-0 z-[9000] hidden items-center justify-center bg-black/80 p-4" onclick="closeLightbox()">
    <div class="max-w-3xl w-full flex flex-col items-center">
      <img id="lightboxImg" src="" alt="확대 사진" class="max-h-[80vh] w-auto rounded-lg shadow-2xl border border-white/20 object-contain">
      <p id="lightboxCaption" class="text-white text-sm font-medium mt-3 bg-black/50 px-4 py-1.5 rounded-full"></p>
    </div>
  </div>

  <!-- 4. 상단 고정 컨트롤 바 -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 py-3">
      <div class="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-3">
        
        <div class="flex items-center justify-between">
          <div>
            <h1 class="text-lg sm:text-xl font-extrabold text-slate-900 flex items-center gap-2">
              <span class="inline-block w-2.5 h-6 bg-blue-600 rounded-sm"></span>어플 vs 실물 메뉴 비교 대시보드
            </h1>
          </div>
          <button onclick="loadDashboardData()" class="xl:hidden px-3 py-1.5 text-xs font-semibold bg-slate-100 border border-slate-300 rounded-lg">새로고침</button>
        </div>

        <div class="flex flex-wrap items-center gap-2 sm:gap-3">
          <input type="date" id="datePicker" onchange="loadDashboardData()" class="px-2.5 py-1.5 bg-slate-100 border border-slate-200 rounded-lg text-sm font-semibold text-slate-900 focus:outline-none cursor-pointer">
          
          <!-- 사업장 선택 탭 -->
          <div class="flex bg-slate-100 p-1 rounded-lg border border-slate-200 items-center">
            <span class="text-[11px] font-bold text-slate-400 px-2">사업장</span>
            <button type="button" onclick="setSiteFilter('ALL')" id="site_ALL" class="site-tab px-3 py-1 text-xs sm:text-sm font-bold rounded-md bg-slate-800 text-white shadow-sm transition">전체사업장</button>
            <button type="button" onclick="setSiteFilter('R3')" id="site_R3" class="site-tab px-3 py-1 text-xs sm:text-sm font-bold rounded-md text-slate-600 hover:text-slate-900 transition">R3</button>
            <button type="button" onclick="setSiteFilter('R4')" id="site_R4" class="site-tab px-3 py-1 text-xs sm:text-sm font-bold rounded-md text-slate-600 hover:text-slate-900 transition">R4</button>
            <button type="button" onclick="setSiteFilter('R5')" id="site_R5" class="site-tab px-3 py-1 text-xs sm:text-sm font-bold rounded-md text-slate-600 hover:text-slate-900 transition">R5</button>
          </div>

          <!-- 끼니 선택 탭 -->
          <div class="flex bg-slate-100 p-1 rounded-lg border border-slate-200 items-center">
            <span class="text-[11px] font-bold text-slate-400 px-2">끼니</span>
            <button type="button" onclick="setMealFilter('ALL')" id="tab_ALL" class="meal-tab px-3 py-1 text-xs sm:text-sm font-bold rounded-md bg-blue-600 text-white shadow-sm transition">전체</button>
            <button type="button" onclick="setMealFilter('아침')" id="tab_아침" class="meal-tab px-3 py-1 text-xs sm:text-sm font-bold rounded-md text-slate-600 hover:text-slate-900 transition">아침</button>
            <button type="button" onclick="setMealFilter('점심')" id="tab_점심" class="meal-tab px-3 py-1 text-xs sm:text-sm font-bold rounded-md text-slate-600 hover:text-slate-900 transition">점심</button>
            <button type="button" onclick="setMealFilter('저녁')" id="tab_저녁" class="meal-tab px-3 py-1 text-xs sm:text-sm font-bold rounded-md text-slate-600 hover:text-slate-900 transition">저녁</button>
          </div>
        </div>

      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-2 sm:px-6 pt-4 space-y-6">
    <div id="apiWarningBanner" class="hidden bg-amber-50 border border-amber-300 text-amber-900 px-4 py-3 rounded-xl text-xs sm:text-sm font-medium">
      ⚠️ <strong>연동 설정 안내:</strong> <code>index.html</code> 하단의 <code>GAS_WEB_APP_URL</code> 변수에 Apps Script 웹앱 배포 URL을 입력해 주세요.
    </div>
    <div id="datalistContainer"></div>
    <div id="tablesContainer" class="space-y-8"></div>
  </main>

  <script>
    // =========================================================================
    // [필수 입력] Apps Script 웹앱 배포 URL을 입력하세요.
    // =========================================================================
    const GAS_WEB_APP_URL = '여기에_배포한_GAS_웹앱_URL을_입력하세요';

    const DEFAULT_CATEGORIES = {
      '아침': ['김밥', '주먹밥', '스프', '채소찜/채소스틱', '요거트볼', '샌드위치', '하프샐러드', '샐러드', '고구마팩', '과일'],
      '점심': ['도시락', '포케', '김밥', '스프', '채소찜/채소스틱', '샌드위치', '하프샐러드', '샐러드', '고구마팩', '과일'],
      '저녁': ['죽', '델리1', '델리2', '스프', '샌드위치', '홀샐러드', '샐러드', '과일']
    };

    let currentMealFilter = 'ALL';
    let currentSiteFilter = 'ALL';
    let dashboardState = { date: '', masterList: [], records: { '아침': [], '점심': [], '저녁': [] } };

    // Cropper 인스턴스, 현재 선택된 비율('4:3' | '1:1'), 작업중인 셀 정보
    let cropperInstance = null;
    let currentCropRatioMode = '4:3'; // 기본값 무조건 4:3
    let pendingCropContext = null;    // { meal, category, site, rowKey }

    const MEAL_ORDER = ['아침', '점심', '저녁'];
    const MEAL_BADGE_STYLES = { '아침': 'bg-amber-500 text-white', '점심': 'bg-emerald-600 text-white', '저녁': 'bg-indigo-600 text-white' };

    window.addEventListener('DOMContentLoaded', () => {
      const today = new Date();
      document.getElementById('datePicker').value = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
      loadDashboardData();
    });

    async function callGasApi(payload) {
      const response = await fetch(GAS_WEB_APP_URL, {
        method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload)
      });
      if (!response.ok) throw new Error(`HTTP 오류 (${response.status})`);
      const result = await response.json();
      if (!result.success) throw new Error(result.error || '서버 오류 발생');
      return result;
    }

    function setBlockingModal(mode, customMessage) {
      const modal = document.getElementById('blockingModal');
      const spinner = document.getElementById('modalSpinner');
      const check = document.getElementById('modalCheck');
      const text = document.getElementById('modalText');
      if (mode === 'hide') {
        modal.classList.add('hidden'); modal.classList.remove('flex'); document.body.classList.remove('modal-active');
        return;
      }
      document.body.classList.add('modal-active'); modal.classList.remove('hidden'); modal.classList.add('flex');
      if (mode === 'loading') {
        spinner.classList.remove('hidden'); check.classList.add('hidden'); check.classList.remove('flex'); text.textContent = customMessage || '저장중...';
      } else if (mode === 'success') {
        spinner.classList.add('hidden'); check.classList.remove('hidden'); check.classList.add('flex'); text.textContent = customMessage || '완료되었습니다!';
      }
    }

    function setMealFilter(filter) {
      currentMealFilter = filter;
      document.querySelectorAll('.meal-tab').forEach(btn => btn.className = 'meal-tab px-3 py-1 text-xs sm:text-sm font-bold rounded-md text-slate-600 hover:text-slate-900 transition');
      document.getElementById(`tab_${filter}`).className = 'meal-tab px-3 py-1 text-xs sm:text-sm font-bold rounded-md bg-blue-600 text-white shadow-sm transition';
      renderTables();
    }

    function setSiteFilter(filter) {
      currentSiteFilter = filter;
      document.querySelectorAll('.site-tab').forEach(btn => btn.className = 'site-tab px-3 py-1 text-xs sm:text-sm font-bold rounded-md text-slate-600 hover:text-slate-900 transition');
      document.getElementById(`site_${filter}`).className = 'site-tab px-3 py-1 text-xs sm:text-sm font-bold rounded-md bg-slate-800 text-white shadow-sm transition';
      renderTables();
    }

    async function loadDashboardData() {
      const dateStr = document.getElementById('datePicker').value;
      if (!dateStr) return;

      if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes('여기에_배포한')) {
        document.getElementById('apiWarningBanner').classList.remove('hidden');
        dashboardState.date = dateStr; dashboardState.masterList = [];
        MEAL_ORDER.forEach(meal => dashboardState.records[meal] = DEFAULT_CATEGORIES[meal].map(cat => ({ meal, category: cat, menuName: '', appPhotoUrl: '', r3Url: '', r4Url: '', r5Url: '' })));
        buildCategoryDatalists([]); renderTables(); return;
      }

      document.getElementById('apiWarningBanner').classList.add('hidden');
      setBlockingModal('loading', '데이터 불러오는 중...');
      try {
        const res = await callGasApi({ action: 'getDashboardData', date: dateStr });
        dashboardState = res.data;
        buildCategoryDatalists(dashboardState.masterList || []);
        renderTables();
        setBlockingModal('hide');
      } catch (err) { setBlockingModal('hide'); alert('조회 실패: ' + err.message); }
    }

    function buildCategoryDatalists(masterList) {
      const container = document.getElementById('datalistContainer');
      const allCategories = new Set();
      MEAL_ORDER.forEach(meal => (dashboardState.records[meal] || []).forEach(r => allCategories.add(r.category)));
      let html = '';
      allCategories.forEach(cat => {
        const listId = 'dl_' + cat.replace(/[^a-zA-Z0-9가-힣]/g, '_');
        const matched = masterList.filter(item => item.category === cat);
        const items = matched.length > 0 ? matched : masterList;
        html += `<datalist id="${listId}">`;
        items.forEach(item => { html += `<option value="${escapeHtml(item.menuName)}">${escapeHtml(item.category)}</option>`; });
        html += `</datalist>`;
      });
      container.innerHTML = html;
    }

    function renderTables() {
      const container = document.getElementById('tablesContainer');
      const mealsToShow = currentMealFilter === 'ALL' ? MEAL_ORDER : [currentMealFilter];
      let html = '';

      const colClass = currentSiteFilter === 'ALL' ? 'w-1/4' : 'w-1/2';
      const minWidthClass = currentSiteFilter === 'ALL' ? 'min-w-[780px]' : 'min-w-[420px]';

      mealsToShow.forEach(meal => {
        const rows = dashboardState.records[meal] || [];
        const badgeStyle = MEAL_BADGE_STYLES[meal] || 'bg-slate-700 text-white';
        const total = rows.length;

        html += `
        <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
          <div class="px-4 py-3 bg-slate-800 text-white flex flex-wrap items-center gap-2.5">
            <span class="px-2.5 py-0.5 rounded-md text-xs font-extrabold ${badgeStyle}">${meal}</span>
            <h2 class="text-base font-bold">${dashboardState.date} ${meal} 메뉴 (${total}종)</h2>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full border-collapse table-fixed ${minWidthClass}">
              <thead>
                <tr class="bg-slate-100 border-b border-slate-200">
                  <th class="sticky-col-header bg-slate-100 ${colClass} p-3.5 text-left border-r border-slate-200 text-base sm:text-lg font-extrabold text-blue-700">PlanEAT 어플</th>
                  ${currentSiteFilter === 'ALL' || currentSiteFilter === 'R3' ? `<th class="${colClass} p-3.5 text-center border-r border-slate-200 text-base sm:text-lg font-extrabold text-slate-800">R3</th>` : ''}
                  ${currentSiteFilter === 'ALL' || currentSiteFilter === 'R4' ? `<th class="${colClass} p-3.5 text-center border-r border-slate-200 text-base sm:text-lg font-extrabold text-slate-800">R4</th>` : ''}
                  ${currentSiteFilter === 'ALL' || currentSiteFilter === 'R5' ? `<th class="${colClass} p-3.5 text-center text-base sm:text-lg font-extrabold text-slate-800">R5</th>` : ''}
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-200 text-sm">
                ${rows.map((row, idx) => renderTableRow(meal, row, idx)).join('')}
              </tbody>
            </table>
          </div>
        </section>`;
      });
      container.innerHTML = html;
    }

    function renderTableRow(meal, row, idx) {
      const rowKey = `${meal}_${idx}`;
      const datalistId = 'dl_' + row.category.replace(/[^a-zA-Z0-9가-힣]/g, '_');
      const hasAppPhoto = Boolean(row.appPhotoUrl);
      
      let prevMeal = meal === '점심' ? '아침' : (meal === '저녁' ? '점심' : null);
      let hasPrevCategory = false;
      if (prevMeal && dashboardState.records[prevMeal]) {
        hasPrevCategory = dashboardState.records[prevMeal].some(r => r.category === row.category);
      }
      const gridClass = hasPrevCategory ? 'grid grid-cols-2 gap-1.5' : 'flex';

      let html = `<tr class="hover:bg-slate-50/60 transition align-top">`;
      
      // 1열 (PlanEAT 어플)
      html += `
        <td class="sticky-col p-3 border-r border-slate-200 align-top">
          <div class="flex items-center justify-between mb-1.5">
            <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-bold bg-slate-100 text-slate-800 border border-slate-300">${escapeHtml(row.category)}</span>
          </div>
          <div class="relative mb-2">
            <input type="text" list="${datalistId}" id="input_${rowKey}" value="${escapeHtml(row.menuName)}" placeholder="메뉴명 타이핑..." onchange="handleMenuChange('${meal}', '${escapeJs(row.category)}', '${rowKey}')" class="w-full px-2.5 py-1.5 text-sm font-semibold bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <div class="photo-box mb-2" id="appPhotoBox_${rowKey}" tabindex="0" onpaste="handlePastePhoto(event, '${meal}', '${escapeJs(row.category)}', '${rowKey}')" title="마우스 클릭 후 Ctrl+V로 복사한 이미지를 붙여넣을 수 있습니다">
            ${renderPhotoContent(row.appPhotoUrl, `${meal} [${row.category}] 어플 기준`, '사진 업로드 또는 Ctrl+V')}
          </div>
          <div class="${gridClass} w-full">
            <label class="w-full flex items-center justify-center gap-1 py-1.5 rounded-lg text-xs font-bold cursor-pointer transition shadow-sm ${hasAppPhoto ? 'bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300' : 'bg-blue-600 hover:bg-blue-700 text-white'}">
              <span>업로드</span><input type="file" accept="image/*" class="hidden" onchange="handleAppFileSelect(event, '${meal}', '${escapeJs(row.category)}', '${rowKey}')" />
            </label>
            ${hasPrevCategory ? `<button type="button" onclick="handleCopyPrevious('${meal}', '${escapeJs(row.category)}', 'APP', '${rowKey}')" class="w-full py-1.5 rounded-lg text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-600 border border-slate-300 transition shadow-sm tracking-tight">${prevMeal}메뉴와 동일</button>` : ''}
          </div>
        </td>`;

      // 2~4열 (사업장)
      const renderSite = (site, photoUrl) => {
        const hasPhoto = Boolean(photoUrl);
        return `
        <td class="p-3 border-r border-slate-200 last:border-r-0 align-top">
          <div class="flex items-center justify-between mb-2">
            <span class="text-[11px] font-semibold px-1.5 py-0.5 rounded ${hasPhoto ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-400'}">${hasPhoto ? '등록완료' : '미등록'}</span>
          </div>
          <div class="photo-box mb-2">
            ${renderPhotoContent(photoUrl, `${meal} [${row.category}] ${site} 실물`, `${site} 사진 업로드`)}
          </div>
          <div class="${gridClass} w-full">
            <label class="w-full flex items-center justify-center gap-1 py-1.5 rounded-lg text-xs font-bold cursor-pointer transition shadow-sm ${hasPhoto ? 'bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300' : 'bg-blue-600 hover:bg-blue-700 text-white'}">
              <span>업로드</span><input type="file" accept="image/*" class="hidden" onchange="handleFileSelect(event, '${meal}', '${escapeJs(row.category)}', '${site}', '${rowKey}')" />
            </label>
            ${hasPrevCategory ? `<button type="button" onclick="handleCopyPrevious('${meal}', '${escapeJs(row.category)}', '${site}', '${rowKey}')" class="w-full py-1.5 rounded-lg text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-600 border border-slate-300 transition shadow-sm tracking-tight">${prevMeal}메뉴와 동일</button>` : ''}
          </div>
        </td>`;
      };

      if (currentSiteFilter === 'ALL' || currentSiteFilter === 'R3') html += renderSite('R3', row.r3Url);
      if (currentSiteFilter === 'ALL' || currentSiteFilter === 'R4') html += renderSite('R4', row.r4Url);
      if (currentSiteFilter === 'ALL' || currentSiteFilter === 'R5') html += renderSite('R5', row.r5Url);

      html += `</tr>`;
      return html;
    }

    function renderPhotoContent(url, caption, emptyText) {
      if (url) return `<img src="${escapeHtml(url)}" alt="${escapeHtml(caption)}" loading="lazy" onclick="openLightbox('${escapeJs(url)}', '${escapeJs(caption)}')" onerror="this.outerHTML='<div class=\\'text-xs text-rose-500 p-2 text-center\\'>이미지 로드 실패</div>'">`;
      return `<span class="text-[11px] text-slate-400 text-center px-2 leading-relaxed">${escapeHtml(emptyText)}</span>`;
    }

    // =========================================================================
    // [핵심] 사진 업로드 시 기본 4:3 비율로 크롭 모달 오픈 + 1:1 비율 전환 지원
    // =========================================================================
    function updateRatioButtonUI(mode) {
      const btn43 = document.getElementById('ratioBtn_4_3');
      const btn11 = document.getElementById('ratioBtn_1_1');
      if (mode === '4:3') {
        btn43.className = 'px-3 py-1.5 rounded-lg text-xs font-extrabold bg-blue-600 text-white shadow transition';
        btn11.className = 'px-3 py-1.5 rounded-lg text-xs font-extrabold text-slate-300 hover:text-white transition';
      } else {
        btn11.className = 'px-3 py-1.5 rounded-lg text-xs font-extrabold bg-blue-600 text-white shadow transition';
        btn43.className = 'px-3 py-1.5 rounded-lg text-xs font-extrabold text-slate-300 hover:text-white transition';
      }
    }

    function setCropAspectRatio(mode) {
      currentCropRatioMode = mode;
      updateRatioButtonUI(mode);
      if (cropperInstance) {
        cropperInstance.setAspectRatio(mode === '1:1' ? 1 : 4 / 3);
      }
    }

    function openCropModalWithFile(file, context) {
      pendingCropContext = context;
      // 업로드할 때마다 기본값은 무조건 4:3으로 초기화
      currentCropRatioMode = '4:3';
      updateRatioButtonUI('4:3');

      const reader = new FileReader();
      reader.onload = e => {
        const modal = document.getElementById('cropModal');
        const imgEl = document.getElementById('cropTargetImg');

        if (cropperInstance) {
          cropperInstance.destroy();
          cropperInstance = null;
        }

        imgEl.src = e.target.result;
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        document.body.classList.add('modal-active');

        imgEl.onload = () => {
          if (cropperInstance) cropperInstance.destroy();
          cropperInstance = new Cropper(imgEl, {
            aspectRatio: 4 / 3,        // 기본 4:3 가로 비율로 시작
            viewMode: 1,               // 사진 바깥 여백 방지
            dragMode: 'move',
            autoCropArea: 0.92,
            restore: false,
            guides: true,
            center: true,
            highlight: false,
            cropBoxMovable: true,
            cropBoxResizable: true,
            toggleDragModeOnDblclick: false
          });
        };
      };
      reader.readAsDataURL(file);
    }

    function zoomCrop(ratio) {
      if (cropperInstance) cropperInstance.zoom(ratio);
    }

    function rotateCrop(deg) {
      if (cropperInstance) cropperInstance.rotate(deg);
    }

    function resetCrop() {
      if (cropperInstance) {
        cropperInstance.reset();
        setCropAspectRatio('4:3'); // 초기화 시에도 기본 4:3으로 복귀
      }
    }

    function closeCropModal() {
      const modal = document.getElementById('cropModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      document.body.classList.remove('modal-active');
      if (cropperInstance) {
        cropperInstance.destroy();
        cropperInstance = null;
      }
      pendingCropContext = null;
    }

    // [이대로 자르기 & 업로드] 클릭 시 선택된 비율(4:3 -> 800x600 / 1:1 -> 800x800)로 추출하여 저장
    async function confirmCropAndUpload() {
      if (!cropperInstance || !pendingCropContext) return;

      const { meal, category, site, rowKey } = pendingCropContext;
      const targetWidth = 800;
      const targetHeight = currentCropRatioMode === '1:1' ? 800 : 600;

      const canvas = cropperInstance.getCroppedCanvas({
        width: targetWidth,
        height: targetHeight,
        fillColor: '#ffffff',
        imageSmoothingEnabled: true,
        imageSmoothingQuality: 'high'
      });

      const croppedBase64 = canvas.toDataURL('image/jpeg', 0.85);
      closeCropModal();

      const dateStr = document.getElementById('datePicker').value;
      const inputEl = document.getElementById(`input_${rowKey}`);
      const menuName = inputEl ? inputEl.value.trim() : '';

      setBlockingModal('loading', '저장중...');

      try {
        if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes('여기에_배포한')) {
          const target = dashboardState.records[meal].find(r => r.category === category);
          if (site === 'APP') target.appPhotoUrl = croppedBase64;
          else target[site.toLowerCase() + 'Url'] = croppedBase64;
          renderTables();
          setBlockingModal('success', '완료되었습니다!');
          setTimeout(() => setBlockingModal('hide'), 800);
          return;
        }

        if (site === 'APP') {
          const res = await callGasApi({
            action: 'saveAppMenu',
            date: dateStr,
            meal: meal,
            category: category,
            menuName: menuName,
            base64Data: croppedBase64
          });
          const target = dashboardState.records[meal].find(r => r.category === category);
          target.menuName = res.menuName;
          target.appPhotoUrl = res.appPhotoUrl;
        } else {
          const res = await callGasApi({
            action: 'uploadSitePhoto',
            date: dateStr,
            meal: meal,
            category: category,
            site: site,
            menuName: menuName || '미지정',
            base64Data: croppedBase64
          });
          const target = dashboardState.records[meal].find(r => r.category === category);
          target[site.toLowerCase() + 'Url'] = res.imageUrl;
        }

        renderTables();
        setBlockingModal('success', '완료되었습니다!');
        setTimeout(() => setBlockingModal('hide'), 900);
      } catch (err) {
        setBlockingModal('hide');
        alert('업로드 실패: ' + err.message);
      }
    }

    // 파일 선택 & 붙여넣기 이벤트 -> 크롭 모달로 연결
    function handleAppFileSelect(event, meal, category, rowKey) {
      const file = event.target.files[0];
      if (!file) return;
      openCropModalWithFile(file, { meal, category, site: 'APP', rowKey });
      event.target.value = '';
    }

    function handlePastePhoto(event, meal, category, rowKey) {
      const items = (event.clipboardData || event.originalEvent.clipboardData).items;
      for (let item of items) {
        if (item.type.indexOf('image') === 0) {
          event.preventDefault();
          openCropModalWithFile(item.getAsFile(), { meal, category, site: 'APP', rowKey });
          break;
        }
      }
    }

    function handleFileSelect(event, meal, category, site, rowKey) {
      const file = event.target.files[0];
      if (!file) return;
      openCropModalWithFile(file, { meal, category, site, rowKey });
      event.target.value = '';
    }

    // 이전 끼니(아침/점심) 동일 메뉴 복사
    async function handleCopyPrevious(meal, category, site, rowKey) {
      const prevMeal = meal === '점심' ? '아침' : '점심';
      const prevRow = dashboardState.records[prevMeal].find(r => r.category === category);
      if (!prevRow) { alert(`${prevMeal} 메뉴에 해당 카테고리가 없습니다.`); return; }
      
      let sourceUrl = ''; let sourceMenuName = '';
      if (site === 'APP') { sourceUrl = prevRow.appPhotoUrl; sourceMenuName = prevRow.menuName; } 
      else { sourceUrl = prevRow[site.toLowerCase() + 'Url']; }
      if (!sourceUrl && site !== 'APP') { alert(`복사할 ${prevMeal} 사진이 비어있습니다.`); return; }

      setBlockingModal('loading', '저장중...');
      try {
        if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes('여기에_배포한')) {
          const target = dashboardState.records[meal].find(r => r.category === category);
          if (site === 'APP') { target.appPhotoUrl = sourceUrl; target.menuName = sourceMenuName; } 
          else { target[site.toLowerCase() + 'Url'] = sourceUrl; }
          renderTables(); setBlockingModal('success', '완료되었습니다!'); setTimeout(() => setBlockingModal('hide'), 800); return;
        }

        const res = await callGasApi({ action: 'copyPrevious', date: document.getElementById('datePicker').value, meal, category, site, sourceUrl, sourceMenuName });
        const target = dashboardState.records[meal].find(r => r.category === category);
        if (site === 'APP') { target.appPhotoUrl = res.url; target.menuName = res.menuName; } 
        else { target[site.toLowerCase() + 'Url'] = res.url; }
        renderTables(); setBlockingModal('success', '완료되었습니다!'); setTimeout(() => setBlockingModal('hide'), 800);
      } catch (err) { setBlockingModal('hide'); alert('복사 실패: ' + err.message); }
    }

    async function handleMenuChange(meal, category, rowKey) {
      const inputEl = document.getElementById(`input_${rowKey}`);
      if (!inputEl || !GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes('여기에_배포한')) return;
      setBlockingModal('loading', '저장중...');
      try {
        await callGasApi({ action: 'saveAppMenu', date: document.getElementById('datePicker').value, meal, category, menuName: inputEl.value.trim() });
        setBlockingModal('success', '완료되었습니다!'); setTimeout(() => setBlockingModal('hide'), 800);
      } catch (err) { setBlockingModal('hide'); alert('저장 실패: ' + err.message); }
    }

    function openLightbox(url, caption) {
      document.getElementById('lightboxImg').src = url; document.getElementById('lightboxCaption').textContent = caption;
      document.getElementById('lightboxModal').classList.remove('hidden'); document.getElementById('lightboxModal').classList.add('flex');
    }
    function closeLightbox() {
      document.getElementById('lightboxModal').classList.add('hidden'); document.getElementById('lightboxModal').classList.remove('flex'); document.getElementById('lightboxImg').src = '';
    }
    function escapeHtml(str) { return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
    function escapeJs(str) { return String(str||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"'); }
  </script>
</body>
</html>
